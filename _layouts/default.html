
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <script>
  try {
    const savedTheme = localStorage.getItem('blog-theme');
    if (savedTheme === 'dark' || savedTheme === 'light') {
      document.documentElement.dataset.theme = savedTheme;
    }
  } catch (_) {}
</script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Abhi S Aji<span class="brand-period">.</span></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ '/articles/' | relative_url }}">Articles</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="https://github.com/abhi-s-aji" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        <button
  class="theme-toggle"
  id="theme-toggle"
  type="button"
  aria-label="Switch to dark mode"
  title="Switch theme"
>
  <span id="theme-icon" aria-hidden="true">☾</span>
</button>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <a class="footer-brand" href="{{ '/' | relative_url }}">Abhi S Aji.</a>
        <p class="footer-note">An independent technical publication.</p>
      </div>
      <div class="footer-links" aria-label="Social links">
        <a href="https://github.com/abhi-s-aji">GitHub</a>
        <a href="https://www.linkedin.com/in/abhi-s-aji-eden">LinkedIn</a>
        <a href="https://x.com/abhisaji_Eden">X</a>
        <a href="https://bsky.app/profile/abhisaji.bsky.social">Bluesky</a>
        <a href="mailto:abhisajieden.dev@gmail.com">Email</a>
      </div>
      <p class="copyright">© {{ site.time | date: "%Y" }} Abhi S Aji</p>
    </div>
  </footer>
  <script>
  (() => {
    const button = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');
    if (!button || !icon) return;

    function updateTheme(theme) {
      document.documentElement.dataset.theme = theme;
      icon.textContent = theme === 'dark' ? '☀' : '☾';
      button.setAttribute(
        'aria-label',
        theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
      );

      try {
        localStorage.setItem('blog-theme', theme);
      } catch (_) {}
    }

    updateTheme(
      document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light'
    );

    button.addEventListener('click', () => {
      const current = document.documentElement.dataset.theme;
      updateTheme(current === 'dark' ? 'light' : 'dark');
    });
  })();
</script>
</body>
</html>
