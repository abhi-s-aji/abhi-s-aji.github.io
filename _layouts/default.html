
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Abhi S Aji<span class="brand-period">.</span></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Articles</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="https://github.com/abhi-s-aji" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <a class="footer-brand" href="{{ '/' | relative_url }}">Abhi S Aji.</a>
        <p class="footer-note">An independent technical publication.</p>
      </div>
      <div class="footer-links" aria-label="Social links">
        <a href="https://github.com/abhi-s-aji">GitHub</a>
        <a href="https://www.linkedin.com/in/abhi-s-aji-eden">LinkedIn</a>
        <a href="https://x.com/abhisaji_Eden">X</a>
        <a href="https://bsky.app/profile/abhisaji.bsky.social">Bluesky</a>
        <a href="mailto:abhisajieden.dev@gmail.com">Email</a>
      </div>
      <p class="copyright">© {{ site.time | date: "%Y" }} Abhi S Aji</p>
    </div>
  </footer>
</body>
</html>
